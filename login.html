<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fibromialgia</title>
  <link rel="stylesheet" href="login.css">
  <script>
    // Redirige automáticamente si ya hay token
    const token = localStorage.getItem("token");
    if (token) {
      window.location.href = "index.html";
    }
  </script>
</head>
<body>
<div class="login-container">  
  <header class="login-header">
    <h1 class="nombre-software">💠 FibroCare AI</h1>  
    <h2 class="titulo-plataforma">Plataforma Web para la Detección Temprana de Síntomas de Fibromialgia</h2>
    <p class="subtitulo">Accede para gestionar la predicción y seguimiento de los pacientes</p>
  </header>

  <h2>🔐 Iniciar Sesión</h2>
  <form id="loginForm">
    <label for="correo">Correo</label>
    <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required placeholder="********">

    <button type="submit">Ingresar</button>
  </form>
  <p id="mensaje"></p>
</div>

<script>
  const loginForm = document.getElementById("loginForm");
  const mensaje = document.getElementById("mensaje");

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();

    const email = document.getElementById("correo").value;
    const password = document.getElementById("password").value;

    if(email === SECRETS.usuario && password === SECRETS.clave) {
      const tokenDummy = btoa(JSON.stringify({nombre: "Admin", apellido: "User", rol: "admin"})) + ".dummy";
      localStorage.setItem("token", tokenDummy);

      mensaje.textContent = "✅ Inicio de sesión exitoso";
      mensaje.classList.add("success");

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    } else {
      mensaje.textContent = "❌ Usuario o contraseña incorrectos";
      mensaje.classList.add("error");
    }
  });
</script>
</body>
</html>
<script src="s.js"></script>
